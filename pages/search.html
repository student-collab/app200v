<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>
  <link rel="stylesheet" href="../CSS/main.css">
  <link rel="stylesheet" href="../CSS/search.css">
  <script src="../JS/indexMain.js" type="module" defer></script>
  <script src="../JS/main.js" type="module" defer></script>
</head>

<style>



/* * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
 *  Flyttet ut av main.css -- dette gjelder kun for        *
 *  search.html                                            *
 * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */

body.search-page {
    background-color: var(--bg-color);
    color: var(--font-color-main);
}

.search-page-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem 3rem 1rem;
}

#search-field-and-info {
    background-color: #ffffff;
    border: 1px solid var(--bordercolor-form-fields);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}

.search-page__title {
    margin: 0 0 1rem 0;
    color: var(--font-color-main);
    font-size: 2.5rem;
    font-weight: 700;
}



.search-empty-text {
    color: var(--font-color-forms);
    margin: 1rem 0 0 0;
    font-size: 1rem;
}

/* * ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ ^ * * * * * * * * * * * * * * *
 *  Spesifikk CSS for search.html -- SLUTT
 * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * */


</style>
<body class="search-page" style="background:#f7f7f7; color:#767D86;">

  <header>
    <div id="search-header-left" style="display:flex; align-items:center; gap:12px;">
      <button id="burger-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="search-side-menu" style="display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; font-size:2rem; color:#767D86; background:#ffffff; border:1px solid #E2E5EB; border-radius:8px; cursor:pointer; padding:0; flex-shrink:0;">
        ☰
      </button>
      <span style="font-size:0.95rem; color:#767D86;">Menu</span>
      <div id="logo-header">
        <img style="width:25px; height:25px;" src="../img/testSize/SQ.png" alt="Logo: SQ">
        <h1>SideQuest</h1>
      </div>
    </div>
  </header>

  <aside id="search-side-menu" class="search-side-menu-hidden" style="position:fixed; top:0; left:0; width:280px; height:100vh; background:#ffffff; box-shadow:4px 0 18px rgba(0,0,0,0.12); z-index:2000; padding:90px 24px 24px; box-sizing:border-box; transform:translateX(-105%); transition:transform 0.25s ease;">
    <nav id="search-side-menu-links" style="display:flex; flex-direction:column; gap:14px;">
      <a href="../index.html" style="text-decoration:none; color:#767D86; font-size:1.1rem; padding:14px 16px; border-radius:12px; background:#EBECF0; border:1px solid #E2E5EB;">Home</a>
      <a href="./taskFeed.html" style="text-decoration:none; color:#767D86; font-size:1.1rem; padding:14px 16px; border-radius:12px; background:#EBECF0; border:1px solid #E2E5EB;">Task Feed</a>
      <a href="./search.html" style="text-decoration:none; color:#767D86; font-size:1.1rem; padding:14px 16px; border-radius:12px; background:#EBECF0; border:1px solid #E2E5EB;">Search</a>
      <a href="./post-task.html" style="text-decoration:none; color:#767D86; font-size:1.1rem; padding:14px 16px; border-radius:12px; background:#EBECF0; border:1px solid #E2E5EB;">Post Task</a>
    </nav>
  </aside>

  <div id="search-menu-overlay" class="search-menu-overlay-hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.18); z-index:1500; display:none;"></div>

  <main class="search-page-content">

  <!-- SEARCH SECTION -->
  <section id="search-field-and-info" style="background:#ffffff; border:1px solid #E2E5EB; border-radius:16px; padding:24px; box-shadow:0 4px 18px rgba(0,0,0,0.04);">
    <h1>Search</h1>

    <input 
      type="text" 
      placeholder="Search by title, category, location..."
      style="width:100%; box-sizing:border-box; background:#EBECF0; color:#767D86; border:1px solid #E2E5EB; border-radius:12px; padding:14px 16px;"
    >

    <p class="search-empty-text" style="color:#9598A8; margin-bottom:0;">
      Start typing to search
    </p>
  </section>
  </main>
  
  <script>
    const burgerBtn = document.getElementById('burger-menu-btn');
    const sideMenu = document.getElementById('search-side-menu');
    const overlay = document.getElementById('search-menu-overlay');

    function toggleMenu() {
      const isOpen = sideMenu.classList.contains('search-side-menu-open');

      if (isOpen) {
        sideMenu.classList.remove('search-side-menu-open');
        sideMenu.classList.add('search-side-menu-hidden');
        sideMenu.style.transform = 'translateX(-105%)';
        overlay.style.display = 'none';
      } else {
        sideMenu.classList.remove('search-side-menu-hidden');
        sideMenu.classList.add('search-side-menu-open');
        sideMenu.style.transform = 'translateX(0)';
        overlay.style.display = 'block';
      }

      burgerBtn.setAttribute('aria-expanded', String(!isOpen));
    }

    burgerBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
  </script>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</body>
</html>
