<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>TeamWork</title>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="" />
  <link rel="stylesheet" href="../CSS/main.css">
  <link rel="stylesheet" href="../CSS/messages.css">
  <script src="../JS/main.js" type = "module" defer></script>
  <script src="../JS/messages.js" type = "module" defer></script>
  <link rel="icon" href="../img/favicon.png">

  

</head>

<body>

  <div class="subheader" id="profileSubheader">
        <div class="subheader-content">
            <h2 id="subheaderTitle">Messages</h2>
          
        </div>
    </div>
  
  
  <div class="container">

  <select id="createChat"></select>
    <button id="createChatBtn">Create Chat</button> <br><br>

    <div id="loadingChatsState">
      <p>Loading conversations...</p>
    </div>

    <div id="noChatsActiveState" class ="hidden">
      <svg id="icon-messagesOnSite" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h3>No conversations yet</h3>
      <p>Contact a tasker from a job listing to start chatting</p>
    </div>
    
    <div id="hasActiveChatsState" class="hidden">
      <h3>Active chats</h3>
      <div id="chatList"></div>

      <div id="messages"></div>

      <input id="messageInput" type="text">
      <button id="sendBtn">Send</button>
    </div>



    
  </div>
  <nav id="replaceNav">
              Blir erstattet av main.js  
            </nav>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script type="module" src="js/messages.js"></script>
</body>

</html>
