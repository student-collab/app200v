
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>TeamWork</title>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="" />
  <link rel="stylesheet" href="/CSS/postTask.css">
  <link rel="stylesheet" href="/CSS/main.css">
<script src="/JS/main.js" type = "module" defer></script>
<script src="/JS/postTask.js" type = "module" defer></script>


  <link rel="icon" href="/img/favicon.png">

  

</head>

<body>
    
<div class="subheader" id="profileSubheader">
        <div class="subheader-content">
            <h2 id="subheaderTitle">Opprett oppdrag</h2>
            <div id="btnWrap">

              <button id = "returnBtn"> <img src="https://unpkg.com/lucide-static@latest/icons/trash-2.svg" alt="Tøm skjemaet" />Retur</button>
              <button id = "returnBtn"> <img src="https://unpkg.com/lucide-static@latest/icons/trash-2.svg" alt="Tøm skjemaet" />Tøm skjemaet</button>
              
          </div>
        </div>
    </div>



   <div id="page-wrap">
        <div id="main-content">
            <form id ="form__post-task" action="">
                
                <label class="label-with-icon" for="task-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/></svg>Navn på oppdrag</label>
                <input id = "task-title" type="text" required>
                <label class="label-with-icon" for="beskrivelse"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Beskrivelse</label>
                <textarea id = "beskrivelse" style ="resize: none;" required></textarea>
                
                
                <label class="label-with-icon" for="kategori"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.59 13.41 11 3H4v7l9.59 9.59a2 2 0 0 0 2.82 0l4.18-4.18a2 2 0 0 0 0-2.82z"/><path d="M7 7h.01"/></svg>Velg passsende kategori for ditt oppdrag</label>
                <select name="chosenCategory" id="kategori" required>
                    <option value="">--Velg kategori--</option>
                    <option value="Husarbeid">Husarbeid</option>
                    <option value="Hagearbeid">Hagearbeid</option>
                    <option value="Hundepass">Hundepass</option>
                    <option value="Vedlikehold">Vedlikehold</option>
                </select>
                <label class="label-with-icon" for="viser-pris"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M12 6v12"/></svg>Betaling for jobben</label>
                
                <div id="slider-pris-container">
                    <input id="pris-slider" type="range" min="100" max="10000" value="500"  >
                    <input id="viser-pris" type="number" min="100" max="10000" >
                </div>
                
                <label class="label-with-icon" for="urg-toggle-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>Haster</label>
                <div id="urg-btn-container">
                    <span>Velg om dette oppdraget haster</span>
                    <input type="checkbox" id="urg-toggle-btn" />
                    <label id = "urgent-toggle" for="urg-toggle-btn"></label>   
                    </div>

                    <label class="label-with-icon" for="kommune"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Lokasjon</label>
                <input id = "kommune" type="text" placeholder="&#x1F4CD; Klikk på kartet for å velge lokasjon" required>
            </form>

            
              <label id="file-drop-label" class="label-with-icon" for="file-drop__input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Last opp bilder</label>
            <div id="file-drop" role="button" tabindex="0"
       aria-label="Last opp bilder – klikk eller dra filer hit">

           
    <input type="file" id="file-drop__input"
           multiple accept="image/*">

    <div id="file-drop__zone">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104"
           aria-hidden="true">
        <g transform="translate(1,2)">
          <path fill="none" stroke="currentColor" stroke-width="8.75"
            d="m 90.717415,48.468075 v 40.874474 c 0,5.004459 -4.059483,9.033328
               -9.101961,9.033328 H 22.176802 c -5.042481,0 -9.101961,-4.028869
               -9.101961,-9.033328 v -60.9867 c 0,-5.004453 4.05948,-9.033319
               9.101961,-9.033319 h 38.770014"/>
          <path fill="none" stroke="currentColor" stroke-width="8.8"
            d="m 80.213094,19.347656 v 9.875 h -9.87695 v 0.806641 h 9.87695
               v 9.875 h 0.80469 v -9.875 h 9.87695 v -0.806641 h -9.87695 v -9.875 z"/>
          <path fill="currentColor" stroke="currentColor" stroke-width="1"
            d="M 23.076141,82.026109 37.183826,63.182273 48.167666,77.793804
               62.37612,58.345353 80.212264,82.328417 Z"/>
        </g>
      </svg>
      <p>Dra bilder hit, eller <strong>klikk for å velge</strong></p>
      <span>PNG, JPG, WEBP – maks 10 MB per fil</span>
    </div>

    <div id="file-drop__list" hidden></div>

    <p id="file-drop__status" role="alert" aria-live="polite"></p>
  </div>
            
            <button id = "btn-post-task" type = "button">Publiser oppdrag</button>
        </div> 
        
        <div id="map-panel">
                <div id="map-sidebar" class="map-instance"></div>
        </div>
        
        <nav id="replaceNav">
             
        </nav>
            

        
    </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</body>

</html>
