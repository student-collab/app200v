<body>
    



<div id="caption"><span id="caption__left-arrow">&#x1F860;</span><h2>Post a task</h2></div>

   <div id="page-grid">
        <div id="main-content">
            <form id ="form__post-task" action="">
                <label for="task-title">Oppgave tittel</label>
                <input id = "task-title" type="text">
                <label for="beskrivelse">Beskrivelse</label>
                <textarea id = "beskrivelse" style ="resize: none;" name="" id=""></textarea>
                
                <label for="btn-lokasjon">Lokasjon</label>
                <button id="btn-lokasjon" type="button"> &#x1F4CD; Klikk for å velge lokasjon på kartet</button>
                <label for="categories">Velg passsende kategori for ditt oppdrag</label>
                <select name="chosenCategory" id="categories">
                    <option value="">--Velg kategori--</option>
                    <option value="Husarbeid">Husarbeid</option>
                    <option value="Hagearbeid">Hagearbeid</option>
                    <option value="Hundepass">Hundepass</option>
                    <option value="Vedlikehold">Vedlikehold</option>
                </select>
                <label for="pris">Budsjett Pris</label>
                
                <div id="slider-pris-container">
                    <input id="pris-slider" type="range" min="100" max="100000" value="50"  >
                    <span id="viser-pris">50</span>
                </div>
                <script>
                            var slider = document.getElementById("pris-slider");
                            var output = document.getElementById("viser-pris");
                            output.innerHTML = slider.value; // Display the default slider value

                            slider.oninput = function() {
                            output.innerHTML = this.value;
                            }

                </script>
                <label for="urg-toggle-btn">Haster</label>
                <div id="urg-btn-container">
                    <span>Velg om dette oppdraget haster</span>
                    <input type="checkbox" id="urg-toggle-btn" />
                    <label id = "urgent-toggle" for="urg-toggle-btn"></label>   
                    </div>
            </form>

            <p>Vindu for å laste opp bilder
                <a href="https://css-tricks.com/drag-and-drop-file-uploading/">https://css-tricks.com/drag-and-drop-file-uploading/</a>
            </p>
            
            <div id="file-drop">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="24" height="24">
                    <g transform="translate(1, 2)">
                        <path fill="none" stroke="currentColor" stroke-width="8.75"
                        d="m 90.717415,48.468075 v 40.874474 c 0,5.004459 -4.059483,9.033328 -9.101961,9.033328 H 22.176802 c -5.042481,0 -9.101961,-4.028869 -9.101961,-9.033328 v -60.9867 c 0,-5.004453 4.05948,-9.033319 9.101961,-9.033319 h 38.770014" />
                        <path fill="none" stroke="currentColor" stroke-width="8.8"
                        d="m 80.213094,19.347656 v 9.875 h -9.87695 v 0.806641 h 9.87695 v 9.875 h 0.80469 v -9.875 h 9.87695 v -0.806641 h -9.87695 v -9.875 z" />
                        <path fill="currentColor" stroke="currentColor" stroke-width="1"
                        d="M 23.076141,82.026109 37.183826,63.182273 48.167666,77.793804 62.37612,58.345353 80.212264,82.328417 Z" />
                    </g>
                </svg>
            </div>
            <button id = "btn-post-task" type = "button"> Lagre oppdraget</button>
        </div>
