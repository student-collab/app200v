<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<div id="page-grid">

    

    <div id="main-content">
        <div id="task-1" class="task">Task1</div>
        <div id="task-2" class="task">Task2</div>
        <div id="map-inline" class="map-instance"></div>
        <div id="task-3" class="task">Task3</div>
        <div id="task-4" class="task">Task4</div>
        <div id="task-5" class="task">Task5</div>
        <div id="task-6" class="task">Task6</div>
    </div>

    <div id="map-panel">
        <div id="map-sidebar" class="map-instance"></div>
    </div>
    
    <nav id="sidebar">my side-column nav bar</nav>



</div>

<style>
.task {min-width:400px; height: 250px; border: 2px solid coral; }

#page-grid {
    display: grid;
    grid-template-columns: minmax(200px, 300px) 1fr minmax(0, 300px);
    grid-template-areas: "sidebar tasks map";
    column-gap: 50px;
    max-width: 1500px;
    margin: 0 auto;
}

#sidebar {
    grid-area: sidebar;
    position: sticky;
    top: 20px;
    align-self: start;
    border: 2px solid steelblue;
}

#main-content {
    grid-area: tasks;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

#map-panel {
    grid-area: map;
    align-self: start;
    position: sticky;
    top: 20px;
}

/* Wide: sidebar map visible, inline map hidden */
#map-inline { display: none; }

#map-sidebar {
    width: 300px;
    height: 650px;
    background: #e0e0e0;
}

@media (max-width: 900px) {
    #page-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
            "tasks"
            "sidebar";
    }

    #map-panel { display: none; }

    #map-inline {
        display: block;
        width: 100%;
        height: 300px;
        background: #e0e0e0;
    }
}
</style>

<script>
    function initMaps() {
        const options = { center: { lat: 59.9139, lng: 10.7522 }, zoom: 12 };
        new google.maps.Map(document.getElementById('map-sidebar'), options);
        new google.maps.Map(document.getElementById('map-inline'), options);
    }
</script>

<!-- Replace YOUR_API_KEY -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-CC4QtLrD-HD9_63IQFhNroyE8pnOOQY&loading=async&callback=initMaps" async defer></script>

</body>
</html>
