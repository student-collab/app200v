 
    <input type="checkbox" id="toggle" />
    <label id = "urgent-toggle" for="toggle"></label>   

<style>

    #toggle {
  display: none; /* Hide the checkbox */
}

#urgent-toggle {
  display: inline-block;
  width: 50px;
  height: 25px;
  background-color: #ccc;
  border-radius: 25px;
  position: relative;
  cursor: pointer;
  transition: background-color 0.3s;
}

#urgent-toggle::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 19px;
  height: 19px;
  background-color: white;
  border-radius: 50%;
  transition: transform 0.3s;
}

/* On State */
#toggle:checked + #urgent-toggle {
  background-color: #2196F3;
}

#toggle:checked + #urgent-toggle::before {
  transform: translateX(25px);
}   

</style>
