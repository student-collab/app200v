<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<div id="page-grid">

    
    <div id="task-grid">
        <div id="task-1" class="task">Task1</div>
        <div id="task-2" class="task">Task2</div>
        <div id="task-3" class="task">Task3</div>
        <div id="task-4" class="task">Task4</div>
        <div id="task-5" class="task">Task5</div>
        <div id="task-6" class="task">Task6</div>
    </div>
    
    <nav id="footer-menu">my side-column nav bar</nav>
</div>

<style>

#page-grid {
    display: grid;
    grid-template-columns: minmax(200px, 300px) 1fr;
    column-gap: 50px;
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    border: 2px solid green;
}


#task-grid {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
    grid-auto-rows: 18em;
    row-gap: 10px;
    column-gap: 50px;
}

.task {
    width: 20rem;
    border: 2px solid green;
    display: flex;
    flex-direction: column-reverse;
    justify-content: start;
    position: relative;
    overflow: hidden;
    padding: 1em 0 0 1em;
}

#footer-menu {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
    width: 100%;
    border: 2px solid green;
}

</style>

</body>
</html>
