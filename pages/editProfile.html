<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>Edit Profile</title>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="" />
  <link rel="stylesheet" href="../CSS/main.css">
  <script src="../JS/main.js" type = "module" defer></script>
  <link rel="icon" href="../img/favicon.png">

  

</head>

<body>
  <h1>Edit Profile</h1>
  <h3>Profile information</h3>

  <ul id="profileInfoList">
    <li><strong>First Name:</strong> <span id="profileFirstName">Loading...</span></li><br>
    <li><strong>Last Name:</strong> <span id="profileLastName">Loading...</span></li><br>
    <li><strong>Email:</strong> <span id="profileEmail">Loading...</span></li><br>
    <li><strong>Gender:</strong> <span id="profileGender">Loading...</span></li><br>
    <li><strong>Location:</strong> <span id="profileLocation">Loading...</span></li><br>
    <li><strong>Phone:</strong> <span id="profilePhone">Loading...</span></li><br>
  </ul>

  <form id="profileEditForm" style="display:none;">
    <label for="editFirstName">First Name:</label><br>
    <input type="text" id="editFirstName" maxlength="80"><br><br>

    <label for="editLastName">Last Name:</label><br>
    <input type="text" id="editLastName" maxlength="80"><br><br>

    <label for="editEmail">Email:</label><br>
    <input type="email" id="editEmail" maxlength="120"><br><br>

    <label for="editGender">Gender:</label><br>
    <select id="editGender" name="gender">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select><br><br>

    <label for="editLocation">Location:</label><br>
    <input type="text" id="editLocation" maxlength="120"><br><br>

    <label for="editPhone">Phone:</label><br>
    <input type="text" id="editPhone" maxlength="40"><br>
  </form>

  <p id="formStatus" aria-live="polite"></p>
  <button id="editInfoBtn" class="editInfo" type="button">Edit info</button>

  
  
  <nav id="replaceNav">
              Blir erstattet av main.js  
            </nav>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script type="module" src="../JS/editProfile.js"></script>
</body>

</html>
