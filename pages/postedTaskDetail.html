<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Detail</title>
  <link rel="stylesheet" href="/CSS/postedTaskDetail.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="back">←</span>
    <h2>Dog Walking</h2>
  </div>

  <!-- Main container -->
  <div class="container">

    <!-- Image placeholder -->
    <div class="image-box">
      <div class="image-icon"></div>
    </div>

    <!-- Title + rating -->
    <div class="title-row">
      <h1>Dog Walking</h1>
      <div class="rating">⭐ 4.8</div>
    </div>

    <!-- Tags -->
    <div class="tags">
      <span class="tag">📍 Downtown</span>
      <span class="tag">🏷 Pets</span>
      <span class="tag price">20 kr</span>
    </div>

    <!-- Status -->
    <div class="status">Open</div>

    <!-- Description -->
    <div class="section">
      <h3>ABOUT THIS TASK</h3>
      <p>
        Walk my two golden retrievers around the park for 30 minutes
      </p>
    </div>

    <!-- Button -->
    <button class="contact-btn">💬 Contact Poster</button>

  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</body>
</html>
