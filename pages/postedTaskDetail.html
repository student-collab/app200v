<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Detail</title>
  <link rel="stylesheet" href="/CSS/postedTaskDetail.css">
</head>
<body>
  <script src="../JS/postedTaskDetail.js" type = "module" defer></script>


  <!-- Midlertidig element for å vise utviklerne data som skal presenteres -->
  <div id="temp-show"></div>
  <style>
    /* Plasserer elementet sentrert litt ned på skjermen med litt styling */
    #temp-show{
      position:absolute;
      padding: 2rem;
      left: 50%;
      transform: translateX(-50%);
      top:50%;
      background-color: rgba(127, 255, 212, 0.8);
      border:2px solid rgb(55, 112, 93);
      font-size: 1rem;;
      border-radius: 10px;
      white-space:pre-wrap;
    }
  </style>

<!-- ^^^ Midlertidig kode ferdig ^^^ -->



  <!-- Header -->
  <div class="header">
    <span class="back">←</span>
    <h2>Dog Walking</h2>
  </div>

  <!-- Main container -->
  <div class="container">

    <!-- Image placeholder -->
    <div class="image-box">
      <div class="image-icon"></div>
    </div>

    <!-- Title + rating -->
    <div class="title-row">
      <h1>Dog Walking</h1>
      <div class="rating">⭐ 4.8</div>
    </div>

    <!-- Tags -->
    <div class="tags">
      <span class="tag">📍 Downtown</span>
      <span class="tag">🏷 Pets</span>
      <span class="tag price">20 kr</span>
    </div>

    <!-- Status -->
    <div class="status">Open</div>

    <!-- Description -->
    <div class="section">
      <h3>ABOUT THIS TASK</h3>
      <p>
        Walk my two golden retrievers around the park for 30 minutes
      </p>
    </div>

    <!-- Button -->
    <button class="contact-btn">💬 Contact Poster</button>

  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</body>
</html>
