<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>TeamWork</title>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="" />
  <link rel="stylesheet" href="../CSS/oppgaveliste.css">
  <link rel="stylesheet" href="../CSS/taskList.css">
  <link rel="stylesheet" href="../CSS/main.css">
  <script src="https://unpkg.com/lucide@0.396.0/dist/umd/lucide.js"></script>
  <script src="../JS/main.js" type = "module" defer></script>
  <script src="../JS/oppgaveliste.js" type = "module" defer></script>


  <link rel="icon" href="../img/favicon.png">

  

</head>

<body>
<!-- SVG som blir bruk på kort -->
<svg style="display:none">
    <defs>
        <symbol id="icon-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" >
            <path d="M12 2C8.7 2 6 4.7 6 8c0 5 6 14 6 14s6-9 6-14c0-3.3-2.7-6-6-6z"/>
            <circle cx="12" cy="8" r="2"/>
        </symbol>
        <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" >
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
        </symbol>
    </defs>
</svg>
<!-- Søkefelt med filtrerings alternativer -->
  <div id="search-field-and-info"> 
      <!-- En enkel forstørrelsesglass SVG som kanskje fjernes -->
      <svg id = "searchbar-mag-symbol" viewBox="0 0 24 24" fill="none" style="width: 2em; height:2em;"  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    <input type="text" placeholder="     Search tasks near you">
    <button id = "rating-btn">⭐ Rating</button>
    <button id ="urgent-btn">⚡Urgent</button>
    <div class="distance-segment">
      <button class="segment-btn">5 km</button>
      <button class="segment-btn ">10 km</button>
      <button class="segment-btn">20 km</button>
      <button class="segment-btn segment-btn--active">Alle</button>
  </div>
    <p><span id = "nearby-tasks">6</span> tasks nearby</p>
  </div> 

    
  
 
  
  <div id="oppgavelisten">

    <div id="task-1" class="task">
      <div class="task__main">
        <h2 class="task__title">beskrivende overskrift</h2>
        <div class="task__info">
          <span class="task__location">
            <svg width="1em" height="1em"><use href="#icon-location"/></svg>
            
            location
              </span>
              <span class="task__rating">
                <svg width="1em" height="1em"><use href="#icon-star"/></svg>
                rating
              </span>
              <span class="task__price">
                20 kr
              </span>
            </div>
          </div>
          <img src="../img/testSize/deer54x54.png" alt="54x54" class="task__img">
        </div>
        
      </div>

            <nav id="replaceNav">
              Blir erstattet av main.js  
            </nav>
</div>  
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</body>

</html>
